# CONFIGURACIÓN GENERAL
spring.application.name=elite-backend
server.port=8080

# CONEXIÓN A MYSQL
spring.datasource.url=jdbc:mysql://localhost:3306/elite_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# JPA / HIBERNATE
# validate: verifica que las entidades coincidan con la BD, pero NO las modifica
spring.jpa.hibernate.ddl-auto=validate

# Mostrar SQL en consola (útil para debug)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialecto específico para MySQL 8+
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect